name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest

    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: go

      - name: Request Go proxy indexing
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          URL="https://proxy.golang.org/github.com/ascendingheavens/falcon/@v/${RELEASE_TAG}.info"

          echo "Requesting Go proxy indexing for ${RELEASE_TAG}"

          if curl --fail --silent --show-error \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 15 \
            --retry-max-time 180 \
            "$URL"; then
            echo "Go proxy responded successfully."
          else
            echo "::warning::Go proxy indexing is not yet available."
          fi
